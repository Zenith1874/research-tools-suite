<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国宏观经济、人口与家庭</title>
<script src="/vendor/react.min.js"></script>
<script src="/vendor/react-dom.min.js"></script>
<script src="/vendor/babel.min.js"></script>
<link rel="stylesheet" href="/research-nav.css">
<script src="/research-nav.js" defer></script>
<style>
:root{--bg:#07111f;--panel:#0d1728;--panel2:#111d31;--bd:#22324b;--text:#e8eef7;--muted:#8ea0b8;--dim:#bac8da;--blue:#4f8fff;--cyan:#14d9d1;--green:#25d39a;--red:#ff647c;--amber:#f4ad45;--purple:#a985ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1460px;margin:0 auto;padding:22px}
.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.hero h1{font-size:23px;margin:0 0 7px}.sub,.muted{color:var(--muted);font-size:12px;line-height:1.7}.actions,.controls,.switches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,.select,input[type=month]{border:1px solid var(--bd);background:var(--panel2);color:var(--text);border-radius:7px;min-height:35px;padding:7px 11px;font:inherit;font-size:12px}.btn{cursor:pointer}.btn:hover,.btn.active{border-color:var(--blue);background:rgba(79,143,255,.14)}.btn.primary{border-color:rgba(79,143,255,.65);background:rgba(79,143,255,.18)}.btn:disabled{opacity:.5;cursor:wait}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:15px 0;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:11px}.control-label{font-size:10px;color:var(--muted);margin-right:2px}.check{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:14px 0}.tab{border:1px solid var(--bd);background:var(--panel);color:var(--dim);border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;font-size:12px}.tab.active{border-color:var(--blue);color:#fff;background:rgba(79,143,255,.15)}
.notice{border:1px solid rgba(244,173,69,.38);background:rgba(244,173,69,.07);border-radius:8px;padding:9px 12px;margin:8px 0;color:#f6d9a9;font-size:11px;line-height:1.65}.notice.error{border-color:rgba(255,100,124,.5);color:#ffc2cb;background:rgba(255,100,124,.08)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:14px 0}.kpi{background:var(--panel);border:1px solid var(--bd);border-radius:9px;padding:12px;min-width:0}.kpi-label{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi-value{font-size:21px;font-weight:760;margin:6px 0;font-variant-numeric:tabular-nums}.kpi-meta{font-size:9.5px;color:var(--muted);line-height:1.5}.badge{display:inline-block;border:1px solid rgba(37,211,154,.5);color:#aef2d6;border-radius:4px;padding:1px 5px;font-size:9px;margin-left:4px}.badge.derived{border-color:rgba(169,133,255,.55);color:#d4c3ff}.badge.missing{border-color:rgba(255,100,124,.55);color:#ffc2cb}
.section-head{margin:18px 0 10px}.section-head h2{font-size:17px;margin:0 0 5px}.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chart{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}.chart-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.chart-title{font-size:13px;color:var(--dim)}.chart-sub{font-size:9.5px;color:var(--muted);line-height:1.55;margin-top:3px}.chart-svg{width:100%;height:225px;display:block;cursor:crosshair}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.legend button{border:1px solid transparent;background:transparent;color:var(--dim);font-size:10px;padding:2px 5px;cursor:pointer;border-radius:4px}.legend button.off{opacity:.38;text-decoration:line-through}.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}.tip{position:absolute;z-index:5;top:8px;transform:translateX(-50%);pointer-events:none;background:rgba(7,17,31,.97);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;font-size:10px;line-height:1.6;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}.tip b{color:var(--dim)}
.empty{border:1px dashed var(--bd);border-radius:8px;color:var(--muted);padding:22px;font-size:12px}.source-panel{margin-top:18px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;overflow:hidden}.source-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--bd)}.source-head h3{font-size:13px;margin:0}.table-wrap{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:8px 9px;border-bottom:1px solid rgba(34,50,75,.65);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel2);color:var(--muted);z-index:1}td a{color:#9ec3ff;text-decoration:none}.method{margin:16px 0 4px;color:var(--muted);font-size:10px;line-height:1.7}.method b{color:var(--dim)}
@media(max-width:1100px){.tabs{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.chart-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:14px}.tabs{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr}.toolbar{align-items:flex-start}.chart-svg{height:205px}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const COLORS=['#4f8fff','#ff647c','#f4ad45','#25d39a','#a985ff','#14d9d1','#8ecb5b','#ff8b55'];
function fmt(value,digits=1){if(value===null||value===undefined||Number.isNaN(Number(value)))return '—';const abs=Math.abs(Number(value));const d=abs>=10000?0:abs>=100?1:digits;return Number(value).toLocaleString('zh-CN',{maximumFractionDigits:d,minimumFractionDigits:0})}
function periodIndex(period){const match=String(period||'').match(/^(\d{4})(?:-(\d{2}))?/);return match?Number(match[1])*12+Number(match[2]||12)-1:null}
function resolvedCode(code,currency){return code.replaceAll('{currency}',currency)}
function resolvedUnit(unit,currency){return unit.replace('{currency_unit}',currency==='CNY'?'亿元':'亿美元')}
function segments(rows,frequency){const output=[];let current=[];const maxGap=frequency==='annual'?12:frequency==='quarterly'?4:1;(rows||[]).forEach(row=>{const idx=periodIndex(row.period);const prev=current.length?periodIndex(current[current.length-1].period):null;if(prev!==null&&idx-prev>maxGap){if(current.length)output.push(current);current=[]}current.push(row)});if(current.length)output.push(current);return output}
const STATUS_LABELS={official:'一手官方',official_revised:'一手官方·修订',official_reprinted:'官方表重刊',official_relayed:'官方数据转引',derived:'派生',missing:'缺失'};
function statusLabel(status){return STATUS_LABELS[status]||status||'缺失'}
function sourceTiming(row){const release=row&&row.release_date||'未提供';const releaseNote=row&&row.release_date_not_provided?'（来源未提供）':'';const retrieved=row&&row.retrieved_at||'未提供';return `来源发布日期：${release}${releaseNote} · 获取时间：${retrieved}`}
function LineChart({definition,payload,currency,startIndex,endIndex,axisMode}){
  const [hidden,setHidden]=useState({}),[hover,setHover]=useState(null);
  const unit=resolvedUnit(definition.unit,currency);
  const dataSeries=definition.series.map((template,index)=>{const code=resolvedCode(template,currency);const meta=payload.metrics[code]||{name:code,frequency:'monthly'};const rows=(payload.series[code]||[]).filter(row=>{const idx=periodIndex(row.period);return idx!==null&&(startIndex===null||idx>=startIndex)&&(endIndex===null||idx<=endIndex)});return{code,name:meta.name,frequency:meta.frequency,rows,color:COLORS[index%COLORS.length]}}).filter(item=>item.rows.length);
  const visible=dataSeries.filter(item=>!hidden[item.code]);
  if(!dataSeries.length)return <div className="chart"><div className="chart-title">{definition.title}</div><div className="empty" style={{marginTop:10}}>所选期间没有可用数据。</div></div>;
  const trendVisible=visible.filter(item=>item.rows.length>=2),singleVisible=visible.filter(item=>item.rows.length===1);
  if(!visible.length)return <div className="chart"><div className="chart-head"><div className="chart-title">{definition.title}</div><div className="chart-sub">单位：{unit}</div></div><div className="empty" style={{marginTop:10}}>全部序列已隐藏，点击下方图例恢复。</div><div className="legend">{dataSeries.map(item=><button key={item.code} className="off" onClick={()=>setHidden(current=>({...current,[item.code]:false}))}><i style={{background:item.color}}/>{item.name}</button>)}</div></div>;
  if(!trendVisible.length)return <div className="chart"><div className="chart-head"><div><div className="chart-title">{definition.title}</div>{(definition.subtitle||definition.note)&&<div className="chart-sub">{definition.subtitle||definition.note}</div>}</div><div className="chart-sub">单位：{unit}</div></div><div className="empty" style={{marginTop:10}}>当前筛选范围内可比观测少于 2 期，暂不绘制趋势图；请查看下方覆盖表。{singleVisible.length&&<div style={{marginTop:6}}>单点序列：{singleVisible.map(item=>item.name).join('、')}</div>}</div><div className="legend">{dataSeries.map(item=><button key={item.code} className={hidden[item.code]?'off':''} onClick={()=>setHidden(current=>({...current,[item.code]:!current[item.code]}))}><i style={{background:item.color}}/>{item.name}{item.rows.length<2?' · 仅1期':''}</button>)}</div></div>;
  const allRows=trendVisible.flatMap(item=>item.rows.map(row=>({...row,code:item.code})));
  const W=760,H=225,L=58,R=16,T=18,B=27;const xValues=allRows.map(row=>periodIndex(row.period));let minX=Math.min(...xValues),maxX=Math.max(...xValues);if(minX===maxX){minX-=1;maxX+=1}
  let vals=allRows.map(row=>Number(row.value)).filter(Number.isFinite);if(definition.threshold!==null&&definition.threshold!==undefined)vals.push(Number(definition.threshold));let minY=Math.min(...vals),maxY=Math.max(...vals);if(axisMode==='zero'){minY=Math.min(0,minY);maxY=Math.max(0,maxY)}if(minY===maxY){minY-=1;maxY+=1}const pad=(maxY-minY)*.08;minY-=pad;maxY+=pad;
  const sx=x=>L+(W-L-R)*(x-minX)/(maxX-minX),sy=y=>T+(H-T-B)*(1-(y-minY)/(maxY-minY));
  const path=rows=>rows.map((row,index)=>`${index?'L':'M'}${sx(periodIndex(row.period)).toFixed(1)},${sy(Number(row.value)).toFixed(1)}`).join(' ');
  const dates=[...new Set(allRows.map(row=>row.period))].sort();const onMove=event=>{const rect=event.currentTarget.getBoundingClientRect();const x=(event.clientX-rect.left)/rect.width*W;const target=minX+(Math.max(L,Math.min(W-R,x))-L)/(W-L-R)*(maxX-minX);let best=dates[0],dist=Infinity;dates.forEach(p=>{const d=Math.abs(periodIndex(p)-target);if(d<dist){dist=d;best=p}});setHover(best)};
  const hx=hover?sx(periodIndex(hover)):null;const tipLeft=hx===null?0:Math.max(10,Math.min(90,hx/W*100));
  return <div className="chart"><div className="chart-head"><div><div className="chart-title">{definition.title}</div>{(definition.subtitle||definition.note)&&<div className="chart-sub">{definition.subtitle||definition.note}</div>}{singleVisible.length>0&&<div className="chart-sub">当前范围内仅 1 期的序列未绘制趋势：{singleVisible.map(item=>item.name).join('、')}。</div>}</div><div className="chart-sub">单位：{unit}</div></div>
    <div style={{position:'relative'}}><svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="chart-svg" onMouseMove={onMove} onMouseLeave={()=>setHover(null)}>
      {[minY,(minY+maxY)/2,maxY].map((value,index)=><g key={index}><line x1={L} x2={W-R} y1={sy(value)} y2={sy(value)} stroke="rgba(34,50,75,.7)" strokeWidth=".7"/><text x={L-7} y={sy(value)+3} textAnchor="end" fill="#8ea0b8" fontSize="9">{fmt(value)}</text></g>)}
      {definition.threshold!==null&&definition.threshold!==undefined&&<g><line x1={L} x2={W-R} y1={sy(definition.threshold)} y2={sy(definition.threshold)} stroke="#f4ad45" strokeDasharray="5,4" strokeWidth="1"/><text x={W-R-2} y={sy(definition.threshold)-4} textAnchor="end" fill="#f4ad45" fontSize="9">荣枯线 {definition.threshold}</text></g>}
      {trendVisible.map(item=>segments(item.rows,item.frequency).map((part,index)=><path key={item.code+'-'+index} d={path(part)} fill="none" stroke={item.color} strokeWidth="1.8"/>))}
      {hover&&<line x1={hx} x2={hx} y1={T} y2={H-B} stroke="#a8b6c8" strokeWidth=".7" strokeDasharray="3,3"/>}
      <text x={L} y={H-7} fill="#8ea0b8" fontSize="9">{dates[0]}</text><text x={W-R} y={H-7} textAnchor="end" fill="#8ea0b8" fontSize="9">{dates[dates.length-1]}</text>
    </svg>{hover&&<div className="tip" style={{left:tipLeft+'%'}}><b>{hover}</b>{trendVisible.map(item=>{const row=item.rows.find(value=>value.period===hover);return row?<div key={item.code}><span style={{color:item.color}}>●</span> {item.name}：{fmt(row.value)} {unit}</div>:null})}</div>}</div>
    <div className="legend">{dataSeries.map(item=><button key={item.code} className={hidden[item.code]?'off':''} onClick={()=>setHidden(current=>({...current,[item.code]:!current[item.code]}))}><i style={{background:item.color}}/>{item.name}{item.rows.length<2?' · 仅1期':''}</button>)}</div>
  </div>
}
function App(){
  const [payload,setPayload]=useState(null),[groupCode,setGroupCode]=useState('growth'),[currency,setCurrency]=useState('CNY'),[years,setYears]=useState(10),[start,setStart]=useState(''),[end,setEnd]=useState(''),[axisMode,setAxisMode]=useState('auto'),[busy,setBusy]=useState(false),[message,setMessage]=useState(''),[fullHistory,setFullHistory]=useState(false);
  async function load(){const response=await fetch('/api/china-macro/data');const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);setPayload(data)}
  useEffect(()=>{if(groupCode==='demography'){setYears(null);setStart('');setEnd('')}},[groupCode]);
  useEffect(()=>{load().catch(error=>setMessage('加载失败：'+error.message))},[]);
  async function update(){setBusy(true);setMessage('本地整理快照同步任务正在启动…');try{const response=await fetch('/api/china-macro/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_history:fullHistory,start_year:fullHistory?2015:null})});const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);setMessage(data.message||'同步已启动');const timer=setInterval(async()=>{const jobs=await (await fetch('/api/jobs')).json();const job=jobs.jobs&&jobs.jobs.china_macro;if(job&&job.status!=='running'){clearInterval(timer);setBusy(false);const demo=job.result&&job.result.demography||{};const detail=demo.rows_read!==undefined?`人口家庭扫描 ${demo.rows_read} 条，变更 ${demo.records_changed||0} 条，保持不变 ${demo.records_unchanged||0} 条`:'';setMessage(job.status==='done'?`同步完成${detail?'：'+detail:''}`:'同步失败：'+(job.error||'未知错误'));load()}},2500)}catch(error){setBusy(false);setMessage('同步请求失败：'+error.message)}}
  const latestIndex=useMemo(()=>{if(!payload)return null;const values=Object.values(payload.series).flat().map(row=>periodIndex(row.period)).filter(value=>value!==null);return values.length?Math.max(...values):null},[payload]);
  let startIndex=start?periodIndex(start):null,endIndex=end?periodIndex(end):null;if(!start&&years&&latestIndex!==null)startIndex=latestIndex-years*12+1;
  if(!payload)return <div className="wrap"><div className={message?'notice error':'empty'}>{message||'正在加载中国宏观数据…'}</div></div>;
  const group=payload.groups.find(item=>item.code===groupCode)||payload.groups[0];const groupCodes=new Set(group.charts.flatMap(chart=>chart.series.map(code=>resolvedCode(code,currency))));const coverage=payload.coverage.filter(row=>groupCodes.has(row.code));
  const cardCodes={growth:['CN_GDP_Q_REAL_YOY','CN_IP_YOY'],demand:['CN_RETAIL_YOY','CN_FAI_YTD_YOY'],prices:['CN_CPI_YOY','CN_PMI_MFG'],employment:['CN_UNEMP_SURVEY','CN_EMPLOYED_YOY_DERIVED','CN_DISPOSABLE_INCOME_YOY_DERIVED'],demography:['CN_BIRTHS','CN_MARRIAGES','CN_DIVORCES_TOTAL_DERIVED'],trade:[`CN_GACC_EXPORT_${currency}_MONTH_YOY`,`CN_GACC_IMPORT_${currency}_MONTH_YOY`],capital:[`CN_MOFCOM_FDI_${currency}_YTD_YOY`,`CN_SAFE_XB_NET_${currency}`]}[groupCode]||[];
  const activeCards=cardCodes.map(code=>{const rows=payload.series[code]||[],row=rows[rows.length-1],meta=payload.metrics[code]||{name:code,unit:''};return row?{code,label:meta.name,value:row.value,unit:row.unit||meta.unit,period:row.period,data_status:row.data_status,evidence_tier:row.evidence_tier,source_name:row.source_name,source_url:row.source_url,release_date:row.release_date,retrieved_at:row.retrieved_at,release_date_not_provided:row.release_date_not_provided}:{code,label:meta.name,value:null,unit:meta.unit,period:null,data_status:'missing',evidence_tier:'缺失'}});
  function exportCsv(){const rows=[];group.charts.forEach(chart=>chart.series.forEach(template=>{const code=resolvedCode(template,currency),meta=payload.metrics[code]||{name:code,unit:''};(payload.series[code]||[]).forEach(row=>{const idx=periodIndex(row.period);if((startIndex===null||idx>=startIndex)&&(endIndex===null||idx<=endIndex))rows.push([code,meta.name,row.period,row.value,row.unit||meta.unit,row.data_status,row.evidence_tier||statusLabel(row.data_status),row.source_name,row.source_url,row.release_date||'',row.retrieved_at||'',row.release_date_not_provided??'',row.release_date_reason||''])})}));const esc=value=>'"'+String(value??'').replaceAll('"','""')+'"';const csv='\ufeff'+[['indicator_code','indicator_name','period','value','unit','data_status','evidence_tier','source_name','source_url','release_date','retrieved_at','release_date_not_provided','release_date_reason'],...rows].map(row=>row.map(esc).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=`china_macro_${group.code}_${currency}.csv`;link.click();URL.revokeObjectURL(link.href)}
  return <div className="wrap"><div className="hero"><div><h1>中国宏观经济、人口与家庭</h1><div className="sub">国家统计局 + 民政部 + 海关总署 + 商务部 + 国家外汇管理局 · 经核验整理快照 · 来源层级逐行标注 · 缺失不插值</div></div><div className="actions"><button className="btn primary" disabled={busy} onClick={update}>{busy?'同步中…':'同步本地整理快照'}</button><label className="check"><input type="checkbox" checked={fullHistory} onChange={event=>setFullHistory(event.target.checked)}/> 海关/商务部历史回填（2015起）</label><button className="btn" onClick={exportCsv}>导出当前板块 CSV</button></div></div>
    {message&&<div className={message.includes('失败')?'notice error':'notice'}>{message}</div>}
    <div className="toolbar"><div className="controls"><span className="control-label">期间</span>{[3,5,10,null].map(value=><button key={String(value)} className={'btn '+(years===value&&!start?'active':'')} onClick={()=>{setYears(value);setStart('');setEnd('')}}>{value?value+'年':'全部'}</button>)}<input type="month" value={start} onChange={event=>{setStart(event.target.value);setYears(null)}}/><span className="muted">至</span><input type="month" value={end} onChange={event=>setEnd(event.target.value)}/></div><div className="switches"><span className="control-label">币种</span>{payload.currency_options.map(item=><button key={item.code} className={'btn '+(currency===item.code?'active':'')} onClick={()=>setCurrency(item.code)}>{item.label}</button>)}<span className="control-label">纵轴</span><button className={'btn '+(axisMode==='auto'?'active':'')} onClick={()=>setAxisMode('auto')}>自动</button><button className={'btn '+(axisMode==='zero'?'active':'')} onClick={()=>setAxisMode('zero')}>从零</button></div></div>
    <div className="tabs">{payload.groups.map(item=><button key={item.code} className={'tab '+(item.code===group.code?'active':'')} onClick={()=>setGroupCode(item.code)}>{item.title}</button>)}</div>
    <div className="section-head"><h2>{group.title}</h2><div className="sub">{group.description}</div></div>
    {!!activeCards.length&&<div className="kpis">{activeCards.map(card=><div className="kpi" key={card.code}><div className="kpi-label" title={card.label}>{card.label}<span className={'badge '+(card.data_status||'missing')}>{statusLabel(card.data_status)}</span></div><div className="kpi-value">{fmt(card.value)} <span style={{fontSize:11}}>{card.unit||''}</span></div><div className="kpi-meta">{card.period||'暂无'} · {card.evidence_tier||'缺失'} · {card.source_name||'—'}{card.source_url&&<> · <a href={card.source_url} target="_blank" rel="noreferrer" style={{color:'#9ec3ff'}}>原文</a></>}<br/>{sourceTiming(card)}</div></div>)}</div>}
    <div className="chart-grid">{group.charts.map(chart=><LineChart key={chart.code+'-'+currency} definition={chart} payload={payload} currency={currency} startIndex={startIndex} endIndex={endIndex} axisMode={axisMode}/>)}</div>
    <div className="source-panel"><div className="source-head"><h3>当前板块数据覆盖与来源</h3><span className="muted">{coverage.length} 条序列</span></div><div className="table-wrap"><table><thead><tr><th>指标</th><th>频率</th><th>单位</th><th>起点</th><th>最新资料期</th><th>N</th><th>状态</th><th>证据层级</th><th>最新来源</th><th>来源发布日期</th><th>获取时间</th></tr></thead><tbody>{coverage.map(row=><tr key={row.code}><td title={row.code}>{row.name}</td><td>{row.frequency}</td><td>{row.unit}</td><td>{row.start_period}</td><td>{row.end_period}</td><td>{row.n_obs}</td><td>{statusLabel(row.latest_status)}</td><td>{row.latest_source_tier||'未分类'}</td><td>{row.source_url?<a href={row.source_url} target="_blank" rel="noreferrer">{row.source_name||'原文'}</a>:'—'}</td><td>{row.latest_release_date||'未提供'}</td><td>{row.latest_retrieved_at||'未提供'}</td></tr>)}</tbody></table></div></div>
    <div className="method"><b>口径说明：</b>{payload.warnings.map((warning,index)=><span key={index}>{index?'；':''}{warning}</span>)}。<br/><b>本地同步时间：</b>{payload.local_sync_at||payload.updated_at||'—'}；<b>来源发布日期/获取时间：</b>按序列在上表逐行显示，未提供时保留“未提供”。本页是数据观察层；相关不代表因果，跨体系数值不机械相减。</div>
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
